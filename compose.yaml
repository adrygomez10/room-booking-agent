services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      MODEL_MODE: ${MODEL_MODE:-demo}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    volumes:
      - bookings:/app/data
    restart: unless-stopped
volumes:
  bookings:
